<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- 16-pixel drawing for favicon.ico: squares 3, gaps 1, so nothing blurs.
       The master does not divide evenly at this size. -->
  <rect width="16" height="16" rx="3.5" fill="#131614"/>
  <g fill="#FAFAF7">
    <rect x="2" y="2" width="3" height="3"/><rect x="6" y="2" width="3" height="3"/><rect x="10" y="2" width="3" height="3"/>
    <rect x="2" y="6" width="3" height="3"/><rect x="6" y="6" width="3" height="3"/><rect x="10" y="6" width="3" height="3"/>
    <rect x="2" y="10" width="3" height="3"/><rect x="6" y="10" width="3" height="3"/>
  </g>
  <rect x="10" y="10" width="3" height="3" fill="#10B981"/>
</svg>
